<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>VLM Benchmark — RPS & Latency by Token</title>
<style>
  :root {
    --bg:        #0D1B2A;
    --panel:     #142539;
    --panel-2:   #1B2E46;
    --line:      #253B55;
    --text:      #FFFFFF;
    --muted:     #8892A0;
    --muted-2:   #B5BFCC;
    --accent:    #00D4FF;
    --good:      #1D9E75;
    --bad:       #E24B4A;
    --purple:    #7C6AE0;
    --gray:      #88877F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial,
      "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  header .tag {
    font-size: 12px; letter-spacing: .12em; color: var(--accent);
    border-left: 3px solid var(--accent); padding-left: 10px; font-weight: 600;
  }
  h1 {
    margin: 6px 0 2px 0; font-size: 22px; font-weight: 700; color: var(--text);
  }
  .sub { color: var(--muted); font-size: 12px; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    padding: 4px 0 10px 0;
  }
  .card {
    background: var(--panel); border-radius: 12px;
    padding: 14px 16px 10px 16px; position: relative;
    border: 1px solid var(--line);
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .card h3 {
    margin: 0 0 2px 0; font-size: 13px; font-weight: 600; color: var(--muted-2);
    letter-spacing: .05em;
  }
  .card h3 b { color: var(--text); }
  .chart-wrap { position: relative; height: 280px; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 18px; justify-content: center;
    font-size: 12px; color: var(--muted-2);
    padding: 14px 0 4px 0;
    border-top: 1px solid var(--line);
    margin-top: 6px;
  }
  .legend .item { display: flex; align-items: center; gap: 8px; }
  .legend .sw { width: 22px; height: 3px; border-radius: 2px; }
  .legend .mk { font-size: 10px; color: var(--muted); }

  footer {
    color: var(--muted); font-size: 11px; text-align: center;
    padding: 16px 0 4px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="tag">BENCHMARK · RPS & LATENCY</div>
      <h1>VLM Scheduling — New Arch vs Old Infra vs Baseline</h1>
      <div class="sub">
        Locust closed-loop · wait_time = 0 · spawn_rate = 40 · 300 s · 8 pods
      </div>
    </div>
  </header>

  <div class="grid">
    <div class="card"><h3>Token = <b>100</b></h3><div class="chart-wrap"><canvas id="c1"></canvas></div></div>
    <div class="card"><h3>Token = <b>200</b></h3><div class="chart-wrap"><canvas id="c2"></canvas></div></div>
    <div class="card"><h3>Token = <b>400</b></h3><div class="chart-wrap"><canvas id="c3"></canvas></div></div>
    <div class="card"><h3>Token = <b>800</b></h3><div class="chart-wrap"><canvas id="c4"></canvas></div></div>
  </div>

  <div class="legend" id="legend"></div>

  <footer>X: Users &nbsp;·&nbsp; Y₁ (left): RPS &nbsp;·&nbsp; Y₂ (right): Avg response time (s) &nbsp;·&nbsp; ● RPS &nbsp; ■ Avg RT</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const users  = [100, 500, 1000, 2000];
const labels = ['VLM Scheduling', 'VLM Scheduling  cache key=uuid', 'Old infra', 'Baseline'];
const colors = ['#1D9E75', '#7C6AE0', '#E24B4A', '#88877F'];
const dashes = [[], [6, 4], [2, 3], [1, 3]];

const raw = {
  100: {
    rps: [[124.10, 217.46, 222.32, 224.77],
          [121.40, 217.20, 219.02, 220.17],
          [ 90.10, 210.73, 220.31, 224.53],
          [126.83, 222.34, 231.01, 230.06]],
    avg: [[0.730, 2.100, 4.200, 8.100],
          [0.740, 2.100, 4.200, 8.300],
          [1.016, 2.167, 4.118, 8.017],
          [0.710, 2.100, 4.000, 7.900]]
  },
  200: {
    rps: [[ 97.09, 203.37, 212.85, 216.68],
          [ 95.62, 201.68, 210.26, 209.48],
          [ 80.11, 195.74, 210.52, 215.09],
          [ 98.49, 204.01, 220.84, 222.15]],
    avg: [[0.850, 2.200, 4.300, 8.400],
          [0.860, 2.200, 4.300, 8.700],
          [1.143, 2.326, 4.317, 8.376],
          [0.840, 2.200, 4.100, 8.200]]
  },
  400: {
    rps: [[ 55.62, 141.59, 148.24, 184.50],
          [ 55.78, 141.17, 153.93, 179.53],
          [ 48.52, 135.10, 161.48, 161.46],
          [ 55.53, 145.46, 165.53, 188.95]],
    avg: [[1.600, 3.200, 5.700,  9.400],
          [1.600, 3.200, 5.600,  9.000],
          [1.885, 3.372, 5.607, 11.099],
          [1.600, 3.100, 5.700,  9.300]]
  },
  800: {
    rps: [[ 25.40, 72.75, 88.86, 94.74],
          [ 25.18, 72.68, 88.56, 90.82],
          [ 23.70, 71.67, 87.60, 89.23],
          [ 25.33, 73.40, 93.25, 96.75]],
    avg: [[3.600, 6.300,  9.100, 11.000],
          [3.600, 6.300,  9.100,  9.300],
          [3.843, 6.316, 10.259, 19.781],
          [3.600, 6.200,  9.900, 19.000]]
  }
};

const TXT = '#B5BFCC';
const MUTED = '#8892A0';
const GRID = 'rgba(136, 146, 160, 0.18)';
const GRID_SOFT = 'rgba(136, 146, 160, 0.08)';

Chart.defaults.color = TXT;
Chart.defaults.font.family =
  '-apple-system, "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang TC", sans-serif';
Chart.defaults.font.size = 11;

const tokens  = [100, 200, 400, 800];
const canvIds = ['c1', 'c2', 'c3', 'c4'];

tokens.forEach((tk, ti) => {
  const d = raw[tk];
  const datasets = [];
  for (let i = 0; i < 4; i++) {
    datasets.push({
      label: labels[i] + ' RPS',
      data: d.rps[i],
      borderColor: colors[i],
      backgroundColor: colors[i],
      yAxisID: 'y',
      borderDash: dashes[i],
      borderWidth: 2,
      tension: 0.3,
      pointRadius: 3.5,
      pointHoverRadius: 5,
      pointStyle: 'circle'
    });
    datasets.push({
      label: labels[i] + ' Avg',
      data: d.avg[i],
      borderColor: colors[i],
      backgroundColor: 'transparent',
      yAxisID: 'y1',
      borderDash: dashes[i],
      borderWidth: 1.3,
      tension: 0.3,
      pointRadius: 3,
      pointHoverRadius: 5,
      pointStyle: 'rect'
    });
  }
  new Chart(document.getElementById(canvIds[ti]), {
    type: 'line',
    data: { labels: users.map(u => String(u)), datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0D1B2A',
          borderColor: '#253B55',
          borderWidth: 1,
          titleColor: '#FFFFFF',
          bodyColor: '#B5BFCC',
          padding: 10,
          boxPadding: 4
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Users', color: MUTED, font: { size: 11 } },
          grid:  { display: false },
          ticks: { color: MUTED }
        },
        y: {
          position: 'left',
          title: { display: true, text: 'RPS', color: MUTED, font: { size: 11 } },
          beginAtZero: true,
          grid:  { color: GRID_SOFT },
          ticks: { color: MUTED }
        },
        y1: {
          position: 'right',
          title: { display: true, text: 'Avg response (s)', color: MUTED, font: { size: 11 } },
          beginAtZero: true,
          grid:  { drawOnChartArea: false },
          ticks: { color: MUTED }
        }
      }
    }
  });
});

const leg = document.getElementById('legend');
labels.forEach((l, i) => {
  const item = document.createElement('span');
  item.className = 'item';
  item.innerHTML =
    '<span class="sw" style="background:' + colors[i] + '"></span>' +
    '<span>' + l + '</span>' +
    '<span class="mk">(● RPS, ■ Avg)</span>';
  leg.appendChild(item);
});
</script>
</body>
</html>
