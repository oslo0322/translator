<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#fdf6e3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="減法闖關" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🦊</text></svg>" />
<title>減法闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:        oklch(0.96 0.02 95);
  --surface:   #ffffff;
  --surface-2: oklch(0.975 0.012 95);
  --ink:       oklch(0.34 0.045 285);
  --ink-soft:  oklch(0.52 0.04 285);
  --line:      oklch(0.90 0.02 285);

  --coral:     oklch(0.70 0.17 32);
  --coral-d:   oklch(0.58 0.16 32);
  --violet:    oklch(0.62 0.16 285);
  --violet-d:  oklch(0.50 0.15 285);
  --teal:      oklch(0.72 0.12 195);
  --teal-d:    oklch(0.60 0.12 195);
  --green:     oklch(0.72 0.15 150);
  --green-d:   oklch(0.60 0.15 150);
  --gold:      oklch(0.82 0.15 85);
  --red:       oklch(0.62 0.19 25);

  --font-num: 'Fredoka','Noto Sans TC',sans-serif;
  --font-ui:  'Noto Sans TC','Fredoka',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

.app{position:relative;width:100vw;height:100vh;overflow:hidden;}

/* 背景裝飾 */
.bg-shapes{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.5;}
.b1{width:46vmin;height:46vmin;background:oklch(0.86 0.09 285);top:-12vmin;left:-10vmin;}
.b2{width:40vmin;height:40vmin;background:oklch(0.88 0.09 195);bottom:-14vmin;right:-8vmin;}
.b3{width:30vmin;height:30vmin;background:oklch(0.90 0.09 85);bottom:18vmin;left:8vmin;opacity:.4;}
.float-star{position:absolute;color:oklch(0.84 0.12 85);opacity:.55;animation:floaty 6s ease-in-out infinite;}
.s1{font-size:34px;top:14%;right:12%;}
.s2{font-size:24px;top:62%;left:6%;animation-delay:1.5s;}
.s3{font-size:28px;top:26%;left:46%;animation-delay:3s;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(12deg)}}

.stage{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vh,32px);}
.screen{width:min(1080px,96vw);max-height:96vh;display:flex;flex-direction:column;}

/* ===== 3D 按鈕 ===== */
.btn3d{
  position:relative;border:none;cursor:pointer;font-family:var(--font-ui);font-weight:900;
  color:#fff;border-radius:20px;letter-spacing:.5px;
  background:var(--coral);
  box-shadow:0 6px 0 var(--coral-d),0 12px 18px oklch(0.5 0.1 32 / .25);
  transition:transform .08s ease,box-shadow .08s ease,filter .15s;
  transform:translateY(0);
}
.btn3d .btn3d-label{display:block;white-space:nowrap;}
.btn3d:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--coral-d),0 4px 8px oklch(0.5 0.1 32 / .25);}
.btn3d:disabled{filter:grayscale(.5) opacity(.55);cursor:not-allowed;}
.btn3d.md{font-size:20px;padding:14px 26px;}
.btn3d.lg{font-size:23px;padding:16px 34px;}
.btn3d.xl{font-size:28px;padding:20px 34px;width:100%;}
.btn3d.secondary{background:var(--violet);box-shadow:0 6px 0 var(--violet-d),0 12px 18px oklch(0.5 0.1 285 / .25);}
.btn3d.secondary:active:not(:disabled){box-shadow:0 1px 0 var(--violet-d),0 4px 8px oklch(0.5 0.1 285 / .25);}
.btn3d.go{background:var(--green);box-shadow:0 6px 0 var(--green-d),0 12px 18px oklch(0.5 0.1 150 / .25);}
.btn3d.go:active:not(:disabled){box-shadow:0 1px 0 var(--green-d),0 4px 8px oklch(0.5 0.1 150 / .25);}

.ghost-btn{
  border:2.5px solid var(--line);background:var(--surface);color:var(--ink-soft);
  font-family:var(--font-ui);font-weight:700;font-size:18px;padding:12px 22px;border-radius:16px;cursor:pointer;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s;
}
.ghost-btn:hover:not(:disabled){border-color:var(--violet);color:var(--violet);}
.ghost-btn:disabled{opacity:.4;cursor:not-allowed;}

.panel-h{font-size:22px;font-weight:900;margin-bottom:16px;}

/* ===== 星星 ===== */
.stars{display:flex;gap:8px;justify-content:center;}
.star.on{color:var(--gold);text-shadow:0 3px 0 oklch(0.66 0.14 70);}
.star.off{color:var(--line);}
.star.pop{animation:starPop .5s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* ===== 首頁 ===== */
.brand{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
.brand-mascot{font-size:54px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));animation:floaty 5s ease-in-out infinite;}
.brand-title{font-size:40px;font-weight:900;line-height:1;}
.brand-sub{font-size:17px;color:var(--ink-soft);font-weight:700;margin-top:6px;}

.start-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;flex:1;min-height:0;}
.panel{background:var(--surface);border-radius:28px;padding:26px;box-shadow:0 10px 30px oklch(0.5 0.05 285 / .12);display:flex;flex-direction:column;border:1px solid oklch(0.94 0.01 285);}
.choose{min-height:0;}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.chip{
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  background:var(--surface-2);border:3px solid var(--line);border-radius:18px;padding:16px 0;
  font-family:var(--font-num);transition:all .14s;color:var(--ink-soft);
}
.chip:hover{transform:translateY(-2px);}
.chip .chip-num{font-size:32px;font-weight:700;line-height:1;}
.chip .chip-unit{font-size:14px;font-weight:700;}
.chip.active{border-color:var(--coral);background:oklch(0.96 0.04 32);color:var(--coral-d);box-shadow:0 4px 0 oklch(0.85 0.08 32);}

.profile-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.avatar-btn{width:62px;height:62px;border-radius:18px;border:3px solid var(--line);background:var(--surface-2);font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s;}
.avatar-btn:hover{border-color:var(--violet);transform:rotate(-6deg);}
.profile-meta{display:flex;flex-direction:column;gap:2px;}
.profile-label{font-size:13px;color:var(--ink-soft);font-weight:700;}
.name-show{background:none;border:none;font-family:var(--font-ui);font-size:24px;font-weight:900;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.pencil{font-size:16px;color:var(--violet);}
.name-input{font-family:var(--font-ui);font-size:24px;font-weight:900;color:var(--ink);border:none;border-bottom:3px solid var(--violet);background:transparent;width:160px;outline:none;}

.avatar-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:18px;}
.avatar-opt{font-size:26px;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:8px 0;cursor:pointer;transition:.12s;}
.avatar-opt:hover{transform:scale(1.12);}
.avatar-opt.sel{border-color:var(--coral);background:oklch(0.96 0.04 32);}

.side{min-height:0;}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-soft);text-align:center;gap:10px;}
.empty-emo{font-size:46px;}
.empty p{font-weight:700;line-height:1.5;}

.leaderboard{list-style:none;display:flex;flex-direction:column;gap:8px;}
.lb-row{display:grid;grid-template-columns:24px 30px 1fr auto auto;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:9px 12px;font-weight:700;}
.lb-row.gold{background:oklch(0.95 0.06 85);box-shadow:inset 0 0 0 2px var(--gold);}
.lb-row.me{box-shadow:inset 0 0 0 2px var(--violet);}
.lb-rank{font-family:var(--font-num);font-weight:700;color:var(--ink-soft);text-align:center;}
.lb-ava{font-size:22px;text-align:center;}
.lb-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-score{font-family:var(--font-num);font-weight:700;color:var(--green-d);}
.lb-time{font-family:var(--font-num);color:var(--ink-soft);font-size:14px;}

.best-card{margin-top:14px;background:oklch(0.96 0.03 285);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.best-label{font-size:13px;font-weight:900;color:var(--violet-d);letter-spacing:1px;}
.best-detail{font-weight:700;color:var(--ink-soft);font-size:15px;}

/* ===== 作答頁 ===== */
.quiz{gap:16px;}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.player-pill{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:7px 16px 7px 8px;box-shadow:0 4px 12px rgba(0,0,0,.08);font-weight:900;white-space:nowrap;}
.pp-ava{font-size:24px;}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:1;}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);transition:.2s;}
.dot.done{background:var(--green);}
.dot.now{background:var(--coral);transform:scale(1.4);box-shadow:0 0 0 4px oklch(0.7 0.17 32 / .2);}
.timer{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 16px;box-shadow:0 4px 12px rgba(0,0,0,.08);font-family:var(--font-num);font-weight:600;font-size:18px;}
.timer-ico{font-size:18px;}

.quiz-body{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;flex:1;min-height:0;}
.q-stage{background:var(--surface);border-radius:28px;padding:30px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px oklch(0.5 0.05 285 / .12);border:1px solid oklch(0.94 0.01 285);}
.q-counter{font-weight:900;color:var(--ink-soft);font-size:17px;margin-bottom:18px;}
.q-equation{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,22px);flex-wrap:wrap;animation:slideIn .35s cubic-bezier(.2,1,.3,1);}
@keyframes slideIn{0%{opacity:0;transform:translateX(28px)}100%{opacity:1;transform:translateX(0)}}
.q-equation .num{font-family:var(--font-num);font-weight:700;font-size:clamp(56px,11vh,104px);line-height:1;color:var(--ink);}
.q-equation .op{font-family:var(--font-num);font-weight:600;font-size:clamp(40px,7vh,72px);color:var(--violet);}
.answer-box{
  font-family:var(--font-num);font-weight:700;font-size:clamp(56px,11vh,104px);line-height:1;
  min-width:clamp(90px,16vh,150px);height:clamp(90px,16vh,150px);
  display:flex;align-items:center;justify-content:center;
  border:5px dashed var(--line);border-radius:24px;color:var(--coral-d);
  transition:border-color .2s,background .2s;padding:0 12px;
}
.answer-box.filled{border-style:solid;border-color:var(--coral);background:oklch(0.97 0.03 32);animation:pulseBox .25s ease;}
@keyframes pulseBox{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.caret{display:inline-block;width:5px;height:48%;background:var(--coral);border-radius:3px;animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0}}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:12px;}
.key{
  font-family:var(--font-num);font-weight:700;font-size:clamp(26px,4.5vh,40px);color:var(--ink);
  background:var(--surface);border:none;border-radius:18px;cursor:pointer;
  box-shadow:0 5px 0 oklch(0.88 0.015 285),0 8px 14px rgba(0,0,0,.08);
  transition:transform .06s,box-shadow .06s;
}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 oklch(0.88 0.015 285),0 3px 6px rgba(0,0,0,.08);}
.key.util{font-family:var(--font-ui);font-weight:900;font-size:clamp(18px,3vh,24px);color:var(--violet-d);background:oklch(0.96 0.025 285);box-shadow:0 5px 0 oklch(0.86 0.04 285),0 8px 14px rgba(0,0,0,.08);}
.key.util:active{box-shadow:0 1px 0 oklch(0.86 0.04 285),0 3px 6px rgba(0,0,0,.08);}

.quiz-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.quiz-foot .btn3d{min-width:240px;}

/* ===== 結果頁 ===== */
.result{gap:14px;overflow:hidden;}
.result-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.result-title{font-size:clamp(22px,3.4vh,30px);font-weight:900;}
.best-flag{background:var(--gold);color:oklch(0.36 0.08 70);font-weight:900;padding:6px 18px;border-radius:999px;font-size:16px;box-shadow:0 4px 0 oklch(0.7 0.13 70);white-space:nowrap;}

.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.stat-card{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 8px 22px oklch(0.5 0.05 285 / .12);border:1px solid oklch(0.94 0.01 285);}
.stat-ico{font-size:26px;}
.stat-val{font-family:var(--font-num);font-weight:700;font-size:clamp(34px,5vh,50px);line-height:1.05;}
.stat-val small{font-size:.5em;color:var(--ink-soft);}
.stat-unit{font-weight:700;color:var(--ink-soft);font-size:14px;white-space:nowrap;}
.stat-card.time .stat-val{color:var(--teal-d);}
.stat-card.score .stat-val{color:var(--green-d);}
.stat-card.acc .stat-val{color:var(--coral-d);}

.result-body{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;flex:1;min-height:0;}
.review{background:var(--surface);border-radius:22px;padding:20px;box-shadow:0 8px 22px oklch(0.5 0.05 285 / .12);overflow:auto;border:1px solid oklch(0.94 0.01 285);}
.all-correct{display:flex;align-items:center;justify-content:center;height:70%;font-weight:900;font-size:20px;color:var(--green-d);text-align:center;}
.wrong-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.wrong-item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;background:oklch(0.97 0.02 25);border-radius:14px;padding:11px 14px;}
.wq{font-family:var(--font-num);font-weight:700;font-size:22px;}
.wgiven{font-weight:700;color:var(--red);font-size:15px;text-decoration:line-through;text-decoration-color:oklch(0.62 0.19 25 / .5);}
.wright{font-weight:900;color:var(--green-d);background:oklch(0.93 0.06 150);padding:4px 12px;border-radius:10px;font-family:var(--font-num);}

.result-foot{display:flex;align-items:center;justify-content:flex-end;gap:14px;}

/* ===== 慶祝彩帶 ===== */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
.confetti-bit{position:absolute;top:-20px;width:11px;height:16px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(105vh) rotate(540deg)}}

@media (max-width:880px){
  .start-grid,.quiz-body,.result-body{grid-template-columns:1fr;}
  .result-body{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;}
}
</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ===== 題目生成 + 本機儲存 + 共用小元件 ===== -->
<script type="text/babel" data-presets="react">
// ===== 題目生成 + 本機儲存 + 共用小元件 =====

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// 減法題目：被減數(a) ≤ 100、減數(b) ≤ 100、差(a-b) ≥ 0
function genQuestions(count) {
  const qs = [];
  let guard = 0;
  while (qs.length < count && guard < count * 40) {
    guard++;
    const a = randInt(11, 100);      // 被減數
    const b = randInt(1, a);         // 減數 ≤ 被減數 → 差 ≥ 0，且 ≤100
    const key = a + "-" + b;
    if (qs.some((q) => q.key === key)) continue; // 避免完全重複
    qs.push({ a, b, answer: a - b, key });
  }
  // 若湊不滿（極少數情況）就允許重複補齊
  while (qs.length < count) {
    const a = randInt(11, 100);
    const b = randInt(1, a);
    qs.push({ a, b, answer: a - b, key: a + "-" + b + "-" + qs.length });
  }
  return qs;
}

// ---- 本機儲存 ----
const PROFILE_KEY = "math_sub_profile_v1";
const RECORDS_KEY = "math_sub_records_v1";

const AVATARS = ["🦊", "🐼", "🐯", "🐰", "🐸", "🐧", "🦄", "🐙"];

function loadProfile() {
  try {
    const p = JSON.parse(localStorage.getItem(PROFILE_KEY));
    if (p && p.name) return p;
  } catch (e) {}
  return { name: "小高手", avatar: AVATARS[0] };
}
function saveProfile(p) {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) {}
}

function loadRecords() {
  try {
    const r = JSON.parse(localStorage.getItem(RECORDS_KEY));
    if (Array.isArray(r)) return r;
  } catch (e) {}
  return [];
}
function saveRecords(r) {
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(r)); } catch (e) {}
}
function addRecord(rec) {
  const all = loadRecords();
  all.push(rec);
  saveRecords(all);
  return all;
}

// 排行榜排序：先看正確率，再看用時最短
function rankRecords(records) {
  return [...records].sort((x, y) => {
    if (y.accuracy !== x.accuracy) return y.accuracy - x.accuracy;
    return x.timeMs - y.timeMs;
  });
}

// 星星評級
function starsFor(accuracy) {
  if (accuracy >= 100) return 3;
  if (accuracy >= 70) return 2;
  return 1;
}

function fmtTime(ms) {
  const totalSec = ms / 1000;
  if (totalSec < 60) return totalSec.toFixed(1) + " 秒";
  const m = Math.floor(totalSec / 60);
  const s = Math.round(totalSec % 60);
  return m + " 分 " + s + " 秒";
}

// ---- 共用小元件 ----
function Stars({ value, size = 38, animate = false }) {
  return (
    <div className="stars" style={{ fontSize: size }}>
      {[0, 1, 2].map((i) => (
        <span
          key={i}
          className={"star " + (i < value ? "on" : "off") + (animate && i < value ? " pop" : "")}
          style={{ animationDelay: animate ? i * 0.18 + 0.1 + "s" : "0s" }}
        >
          ★
        </span>
      ))}
    </div>
  );
}

// 厚實 3D 按鈕
function Btn({ children, onClick, variant = "primary", size = "md", disabled, style }) {
  return (
    <button
      className={"btn3d " + variant + " " + size}
      onClick={onClick}
      disabled={disabled}
      style={style}
    >
      <span className="btn3d-label">{children}</span>
    </button>
  );
}

Object.assign(window, {
  randInt, genQuestions, AVATARS,
  loadProfile, saveProfile, loadRecords, saveRecords, addRecord,
  rankRecords, starsFor, fmtTime,
  Stars, Btn,
});
</script>

<!-- ===== 三個畫面：首頁 / 作答 / 結果 ===== -->
<script type="text/babel" data-presets="react">
// ===== 三個畫面：首頁 / 作答 / 結果 =====
const { useState, useEffect, useRef } = React;

// ---------- 首頁 ----------
function StartScreen({ profile, setProfile, onStart, records }) {
  const [editing, setEditing] = useState(false);
  const [count, setCount] = useState(10);
  const counts = [3, 5, 8, 10];

  const ranked = window.rankRecords(records);
  const best = ranked[0];

  return (
    <div className="screen start">
      <header className="brand">
        <div className="brand-mascot">🦊</div>
        <div>
          <h1 className="brand-title">減法闖關</h1>
          <p className="brand-sub">100 以內 · 算得快又準！</p>
        </div>
      </header>

      <div className="start-grid">
        <section className="panel choose">
          <h2 className="panel-h">這次要挑戰幾題？</h2>
          <div className="chips">
            {counts.map((c) => (
              <button
                key={c}
                className={"chip " + (count === c ? "active" : "")}
                onClick={() => setCount(c)}
              >
                <span className="chip-num">{c}</span>
                <span className="chip-unit">題</span>
              </button>
            ))}
          </div>

          <div className="profile-row">
            <button className="avatar-btn" onClick={() => setEditing((v) => !v)}>
              <span className="avatar-emoji">{profile.avatar}</span>
            </button>
            <div className="profile-meta">
              <span className="profile-label">玩家</span>
              {editing ? (
                <input
                  className="name-input"
                  value={profile.name}
                  maxLength={6}
                  autoFocus
                  onChange={(e) => setProfile({ ...profile, name: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && setEditing(false)}
                  onBlur={() => setEditing(false)}
                />
              ) : (
                <button className="name-show" onClick={() => setEditing(true)}>
                  {profile.name || "點我命名"} <span className="pencil">✎</span>
                </button>
              )}
            </div>
          </div>

          {editing && (
            <div className="avatar-picker">
              {window.AVATARS.map((a) => (
                <button
                  key={a}
                  className={"avatar-opt " + (profile.avatar === a ? "sel" : "")}
                  onClick={() => setProfile({ ...profile, avatar: a })}
                >
                  {a}
                </button>
              ))}
            </div>
          )}

          <window.Btn variant="primary" size="xl" onClick={() => onStart(count)} style={{ marginTop: "auto" }}>
            開始挑戰　▶
          </window.Btn>
        </section>

        <section className="panel side">
          <h2 className="panel-h">🏆 排行榜</h2>
          {ranked.length === 0 ? (
            <div className="empty">
              <div className="empty-emo">🎯</div>
              <p>還沒有紀錄<br />快來成為第一名！</p>
            </div>
          ) : (
            <ol className="leaderboard">
              {ranked.slice(0, 5).map((r, i) => (
                <li key={i} className={"lb-row " + (i === 0 ? "gold" : "")}>
                  <span className="lb-rank">{i + 1}</span>
                  <span className="lb-ava">{r.avatar}</span>
                  <span className="lb-name">{r.name}</span>
                  <span className="lb-score">{r.accuracy}%</span>
                  <span className="lb-time">{(r.timeMs / 1000).toFixed(1)}s</span>
                </li>
              ))}
            </ol>
          )}
          {best && (
            <div className="best-card">
              <span className="best-label">個人最佳</span>
              <window.Stars value={window.starsFor(best.accuracy)} size={22} />
              <span className="best-detail">{best.correct}/{best.total} 題 · {(best.timeMs / 1000).toFixed(1)} 秒</span>
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

// ---------- 作答 ----------
function QuizScreen({ questions, profile, onFinish }) {
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState(() => questions.map(() => ""));
  const startRef = useRef(Date.now());
  const timerRef = useRef(null);
  const [bump, setBump] = useState(0);

  // 計時器直接更新 DOM，避免每 100ms 重繪整個畫面（會打斷進場動畫）
  useEffect(() => {
    const t = setInterval(() => {
      if (timerRef.current) {
        timerRef.current.textContent = ((Date.now() - startRef.current) / 1000).toFixed(1) + "s";
      }
    }, 100);
    return () => clearInterval(t);
  }, []);

  const cur = answers[idx];
  const q = questions[idx];
  const isLast = idx === questions.length - 1;

  function setCur(val) {
    setAnswers((prev) => {
      const next = [...prev];
      next[idx] = val;
      return next;
    });
  }
  function press(d) {
    if (cur.length >= 3) return;
    if (cur === "0") { setCur(String(d)); setBump((b) => b + 1); return; }
    setCur(cur + String(d));
    setBump((b) => b + 1);
  }
  function back() { setCur(cur.slice(0, -1)); }
  function clear() { setCur(""); }
  function next() {
    if (cur === "") return;
    if (isLast) {
      onFinish(answers, Date.now() - startRef.current);
    } else {
      setIdx((i) => i + 1);
    }
  }
  function prev() { if (idx > 0) setIdx((i) => i - 1); }

  // 實體鍵盤支援
  useEffect(() => {
    function onKey(e) {
      if (e.key >= "0" && e.key <= "9") press(Number(e.key));
      else if (e.key === "Backspace") back();
      else if (e.key === "Enter") next();
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  return (
    <div className="screen quiz">
      <div className="quiz-top">
        <div className="player-pill">
          <span className="pp-ava">{profile.avatar}</span>
          <span className="pp-name">{profile.name}</span>
        </div>
        <div className="dots">
          {questions.map((_, i) => (
            <span
              key={i}
              className={"dot " + (i === idx ? "now " : "") + (answers[i] !== "" ? "done" : "")}
            />
          ))}
        </div>
        <div className="timer">
          <span className="timer-ico">⏱</span>
          <span className="timer-val" ref={timerRef}>0.0s</span>
        </div>
      </div>

      <div className="quiz-body">
        <section className="q-stage">
          <div className="q-counter">第 {idx + 1} 題 / 共 {questions.length} 題</div>
          <div className="q-equation" key={idx}>
            <span className="num">{q.a}</span>
            <span className="op">−</span>
            <span className="num">{q.b}</span>
            <span className="op">=</span>
            <span className={"answer-box " + (cur ? "filled" : "")} key={bump}>
              {cur || <span className="caret" />}
            </span>
          </div>
        </section>

        <section className="keypad">
          {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => (
            <button key={d} className="key" onClick={() => press(d)}>{d}</button>
          ))}
          <button className="key util" onClick={clear}>清除</button>
          <button className="key" onClick={() => press(0)}>0</button>
          <button className="key util" onClick={back}>⌫</button>
        </section>
      </div>

      <div className="quiz-foot">
        <button className="ghost-btn" onClick={prev} disabled={idx === 0}>← 上一題</button>
        <window.Btn variant={isLast ? "go" : "primary"} size="lg" onClick={next} disabled={cur === ""}>
          {isLast ? "完成！看結果 🎉" : "下一題 →"}
        </window.Btn>
      </div>
    </div>
  );
}

// ---------- 結果 ----------
function ResultScreen({ questions, answers, timeMs, profile, records, onReplay, onNew, onHome }) {
  const graded = questions.map((q, i) => ({
    ...q, given: answers[i], ok: String(q.answer) === String(answers[i]),
  }));
  const correct = graded.filter((g) => g.ok).length;
  const total = questions.length;
  const accuracy = Math.round((correct / total) * 100);
  const stars = window.starsFor(accuracy);
  const wrong = graded.filter((g) => !g.ok);

  const ranked = window.rankRecords(records);
  const myRank = ranked.findIndex((r) => r._id === records[records.length - 1]?._id) + 1;
  const isBest = myRank === 1;

  const praise =
    stars === 3 ? "太厲害了！全部答對 ⭐⭐⭐" :
    accuracy >= 70 ? "很棒喔！再加把勁就滿分 💪" :
    "完成挑戰！多練幾次會更快更準 🌱";

  return (
    <div className="screen result">
      <Confetti active={stars >= 2} />
      <div className="result-head">
        <window.Stars value={stars} size={56} animate />
        <h1 className="result-title">{praise}</h1>
        {isBest && <div className="best-flag">🏆 新的個人最佳！</div>}
      </div>

      <div className="result-grid">
        <div className="stat-card time">
          <span className="stat-ico">⏱</span>
          <span className="stat-val">{(timeMs / 1000).toFixed(1)}</span>
          <span className="stat-unit">秒完成</span>
        </div>
        <div className="stat-card score">
          <span className="stat-ico">✅</span>
          <span className="stat-val">{correct}<small>/{total}</small></span>
          <span className="stat-unit">答對題數</span>
        </div>
        <div className="stat-card acc">
          <span className="stat-ico">🎯</span>
          <span className="stat-val">{accuracy}<small>%</small></span>
          <span className="stat-unit">正確率</span>
        </div>
      </div>

      <div className="result-body">
        <section className="review">
          <h2 className="panel-h">{wrong.length === 0 ? "全部答對，完美！🌈" : "訂正一下（答錯 " + wrong.length + " 題）"}</h2>
          {wrong.length === 0 ? (
            <div className="all-correct">🎉 沒有錯題，繼續保持！</div>
          ) : (
            <ul className="wrong-list">
              {wrong.map((g, i) => (
                <li key={i} className="wrong-item">
                  <span className="wq">{g.a} − {g.b} =</span>
                  <span className="wgiven">你寫 {g.given}</span>
                  <span className="wright">正解 {g.answer}</span>
                </li>
              ))}
            </ul>
          )}
        </section>

        <section className="review board">
          <h2 className="panel-h">🏆 排行榜</h2>
          <ol className="leaderboard">
            {ranked.slice(0, 5).map((r, i) => (
              <li key={i} className={"lb-row " + (i === 0 ? "gold " : "") + (r._id === records[records.length - 1]?._id ? "me" : "")}>
                <span className="lb-rank">{i + 1}</span>
                <span className="lb-ava">{r.avatar}</span>
                <span className="lb-name">{r.name}</span>
                <span className="lb-score">{r.accuracy}%</span>
                <span className="lb-time">{(r.timeMs / 1000).toFixed(1)}s</span>
              </li>
            ))}
          </ol>
        </section>
      </div>

      <div className="result-foot">
        <button className="ghost-btn" onClick={onHome}>🏠 回首頁</button>
        <window.Btn variant="secondary" size="lg" onClick={onNew}>🔄 換新題目</window.Btn>
        <window.Btn variant="go" size="lg" onClick={onReplay}>再玩一次 ▶</window.Btn>
      </div>
    </div>
  );
}

function Confetti({ active }) {
  if (!active) return null;
  const colors = ["var(--coral)", "var(--violet)", "var(--gold)", "var(--green)", "var(--teal)"];
  const bits = Array.from({ length: 36 }, (_, i) => i);
  return (
    <div className="confetti">
      {bits.map((i) => (
        <span
          key={i}
          className="confetti-bit"
          style={{
            left: Math.random() * 100 + "%",
            background: colors[i % colors.length],
            animationDelay: Math.random() * 0.6 + "s",
            animationDuration: 1.6 + Math.random() * 1.2 + "s",
            transform: `rotate(${Math.random() * 360}deg)`,
          }}
        />
      ))}
    </div>
  );
}

Object.assign(window, { StartScreen, QuizScreen, ResultScreen, Confetti });
</script>

<!-- ===== 主控制：畫面切換 + 狀態 ===== -->
<script type="text/babel" data-presets="react">
// ===== 主控制：畫面切換 + 狀態 =====
const { useState: useStateApp } = React;

function App() {
  const [screen, setScreen] = useStateApp("start");
  const [profile, setProfileState] = useStateApp(() => window.loadProfile());
  const [count, setCount] = useStateApp(10);
  const [questions, setQuestions] = useStateApp([]);
  const [answers, setAnswers] = useStateApp([]);
  const [timeMs, setTimeMs] = useStateApp(0);
  const [records, setRecords] = useStateApp(() => window.loadRecords());

  function setProfile(p) {
    setProfileState(p);
    window.saveProfile(p);
  }

  function start(c) {
    setCount(c);
    setQuestions(window.genQuestions(c));
    setScreen("quiz");
  }

  function finish(ans, ms) {
    setAnswers(ans);
    setTimeMs(ms);
    const correct = questions.reduce(
      (n, q, i) => n + (String(q.answer) === String(ans[i]) ? 1 : 0), 0
    );
    const total = questions.length;
    const rec = {
      _id: Date.now() + "-" + Math.random().toString(36).slice(2, 6),
      name: profile.name,
      avatar: profile.avatar,
      correct,
      total,
      accuracy: Math.round((correct / total) * 100),
      timeMs: ms,
      date: Date.now(),
    };
    setRecords(window.addRecord(rec));
    setScreen("result");
  }

  function replay() {
    setQuestions(window.genQuestions(count));
    setScreen("quiz");
  }
  function newQuiz() {
    setScreen("start");
  }
  function home() {
    setScreen("start");
  }

  return (
    <div className="app">
      <div className="bg-shapes">
        <span className="blob b1" />
        <span className="blob b2" />
        <span className="blob b3" />
        <span className="float-star s1">★</span>
        <span className="float-star s2">✦</span>
        <span className="float-star s3">★</span>
      </div>

      <div className="stage">
        {screen === "start" && (
          <window.StartScreen
            profile={profile}
            setProfile={setProfile}
            onStart={start}
            records={records}
          />
        )}
        {screen === "quiz" && (
          <window.QuizScreen
            questions={questions}
            profile={profile}
            onFinish={finish}
          />
        )}
        {screen === "result" && (
          <window.ResultScreen
            questions={questions}
            answers={answers}
            timeMs={timeMs}
            profile={profile}
            records={records}
            onReplay={replay}
            onNew={newQuiz}
            onHome={home}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
