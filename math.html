<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fef9c3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="減法挑戰">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>➖</text></svg>">
<title>減法限時挑戰</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fef9c3;--card:#ffffff;--ink:#1f2937;--muted:#6b7280;
  --brand:#f97316;--brand2:#fb923c;--good:#22c55e;--bad:#ef4444;
  --blue:#3b82f6;--shadow:0 4px 0 rgba(0,0,0,.08);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","PingFang TC",sans-serif;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--ink);overflow-x:hidden}

/* ---------- Start screen ---------- */
.screen{min-height:100%;display:flex;flex-direction:column}
#start{align-items:center;justify-content:center;text-align:center;padding:32px 20px;gap:22px}
#start h1{font-size:clamp(32px,7vw,56px);font-weight:900;color:var(--brand)}
#start .emoji{font-size:clamp(56px,14vw,110px);line-height:1}
#start .rules{font-size:clamp(16px,3.4vw,22px);font-weight:700;color:var(--muted)}
#start .pick{font-size:clamp(20px,4vw,26px);font-weight:900;margin-top:4px}
.levels{display:flex;flex-direction:column;gap:16px;width:100%;max-width:460px}
.btn{
  border:none;cursor:pointer;font-weight:900;color:#fff;
  border-radius:999px;transition:transform .05s,box-shadow .05s;font-family:inherit;
}
.btn:active{transform:translateY(4px)}
.level{font-size:clamp(24px,5vw,32px);padding:20px 24px;display:flex;flex-direction:column;gap:2px}
.level small{font-size:.52em;font-weight:700;opacity:.92}
.lv-easy{background:var(--good);box-shadow:0 6px 0 #15803d}
.lv-easy:active{box-shadow:0 2px 0 #15803d}
.lv-mid{background:var(--brand);box-shadow:0 6px 0 #c2410c}
.lv-mid:active{box-shadow:0 2px 0 #c2410c}
.lv-hard{background:#8b5cf6;box-shadow:0 6px 0 #6d28d9}
.lv-hard:active{box-shadow:0 2px 0 #6d28d9}

/* ---------- Game ---------- */
#game{display:none}
.bar{
  position:sticky;top:0;z-index:10;background:var(--bg);
  padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top,0));
  border-bottom:3px solid #fde68a;display:flex;align-items:center;gap:12px;
}
.lvTag{font-size:clamp(13px,3vw,16px);font-weight:900;color:#fff;background:var(--blue);padding:6px 12px;border-radius:999px;white-space:nowrap}
.timer{font-size:clamp(34px,8vw,52px);font-weight:900;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1;min-width:2.4em;text-align:center}
.timer.warn{color:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.progress{flex:1;height:18px;background:#fde68a;border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));transition:width 1s linear;border-radius:999px}

.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:14px;padding:16px;padding-bottom:140px;max-width:900px;margin:0 auto;width:100%;
}
.q{
  background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;font-size:clamp(26px,5vw,34px);font-weight:800;
  border:3px solid transparent;
}
.q .no{color:var(--muted);font-size:.6em;font-weight:900;min-width:1.6em}
.q .eq{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;letter-spacing:1px}
.q input{
  width:2.4em;font-size:1em;font-weight:900;text-align:center;font-family:inherit;
  border:none;border-bottom:4px solid var(--brand2);background:#fff7ed;color:var(--blue);
  border-radius:10px;padding:6px 4px;outline:none;-webkit-user-select:text;user-select:text;
}
.q input:focus{background:#ffedd5;border-bottom-color:var(--brand)}
.q.right{border-color:var(--good);background:#f0fdf4}
.q.wrong{border-color:var(--bad);background:#fef2f2}
.q .mark{font-size:.9em;min-width:1.2em;text-align:center}
.q .correct{font-size:.55em;font-weight:900;color:var(--good)}

.footer{
  position:fixed;left:0;right:0;bottom:0;padding:14px 16px;
  padding-bottom:max(14px,env(safe-area-inset-bottom,0));
  background:linear-gradient(180deg,rgba(254,249,195,0),var(--bg) 35%);
  display:flex;justify-content:center;
}
#submitBtn{font-size:clamp(22px,5vw,30px);padding:16px 56px;background:var(--good);box-shadow:0 6px 0 #15803d}
#submitBtn:active{box-shadow:0 2px 0 #15803d}

/* ---------- Result ---------- */
#result{display:none;align-items:center;justify-content:center;text-align:center;padding:32px 20px;gap:18px}
#result .scoreBox{background:var(--card);border-radius:32px;padding:28px 40px;box-shadow:var(--shadow)}
#result .scoreNum{font-size:clamp(72px,20vw,140px);font-weight:900;line-height:1}
#result .scoreLabel{font-size:clamp(20px,4vw,26px);font-weight:700;color:var(--muted);margin-top:4px}
#result .face{font-size:clamp(64px,16vw,110px)}
#result .msg{font-size:clamp(22px,5vw,32px);font-weight:900}
.review{font-size:16px;color:var(--muted);font-weight:700}
.resultBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#againBtn{font-size:clamp(20px,4.5vw,28px);padding:16px 40px;background:var(--blue);box-shadow:0 6px 0 #1d4ed8}
#againBtn:active{box-shadow:0 2px 0 #1d4ed8}
#menuBtn{font-size:clamp(20px,4.5vw,28px);padding:16px 40px;background:var(--muted);box-shadow:0 6px 0 #374151}
#menuBtn:active{box-shadow:0 2px 0 #374151}
</style>
</head>
<body>

<!-- 開始畫面 -->
<section id="start" class="screen">
  <div class="emoji">➖🧮</div>
  <h1>減法限時挑戰</h1>
  <div class="rules">🔢 10 題 ・ ⏱️ 限時 80 秒 ・ 🏆 全對 100 分</div>
  <div class="pick">選擇難度 👇</div>
  <div class="levels">
    <button class="btn level lv-easy"  data-level="easy">簡單<small>兩位數 − 一位數</small></button>
    <button class="btn level lv-mid"   data-level="mid">中等<small>兩位數 − 兩位數，不借位</small></button>
    <button class="btn level lv-hard"  data-level="hard">進階<small>兩位數 − 兩位數，有借位</small></button>
  </div>
</section>

<!-- 遊戲畫面 -->
<section id="game" class="screen">
  <div class="bar">
    <div id="lvTag" class="lvTag">簡單</div>
    <div id="timer" class="timer">80</div>
    <div class="progress"><i id="progress"></i></div>
  </div>
  <div id="grid" class="grid"></div>
  <div class="footer">
    <button id="submitBtn" class="btn">交卷</button>
  </div>
</section>

<!-- 結算畫面 -->
<section id="result" class="screen">
  <div class="face" id="face">🎉</div>
  <div class="scoreBox">
    <div class="scoreNum" id="scoreNum">0</div>
    <div class="scoreLabel">分</div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="review" id="reviewText"></div>
  <div class="resultBtns">
    <button id="againBtn" class="btn">再玩一次</button>
    <button id="menuBtn" class="btn">選難度</button>
  </div>
</section>

<script>
(function(){
  const TOTAL = 10;
  const LIMIT = 80;
  const LEVEL_NAME = {easy:'簡單', mid:'中等', hard:'進階'};

  const startEl   = document.getElementById('start');
  const gameEl    = document.getElementById('game');
  const resultEl  = document.getElementById('result');
  const gridEl    = document.getElementById('grid');
  const timerEl   = document.getElementById('timer');
  const progEl    = document.getElementById('progress');
  const lvTagEl   = document.getElementById('lvTag');

  let level     = 'easy';
  let questions = [];      // {a,b,answer}
  let timeLeft  = LIMIT;
  let tick      = null;
  let finished  = false;

  const rnd = (min,max) => Math.floor(Math.random()*(max-min+1))+min;

  // 簡單：兩位數 − 一位數為主，不借位、不為負
  function makeEasy(){
    while(true){
      const t1 = rnd(1,9);
      const o1 = rnd(0,9);
      const a  = t1*10 + o1;
      let b;
      if(Math.random() < 0.75){          // 大多是一位數減數
        if(o1 === 0) continue;           // 個位 0 無法在不借位下減一位數
        b = rnd(1, o1);
      }else{                              // 少部分小的兩位數減數，仍不借位
        const t2 = rnd(1, t1);
        const o2 = rnd(0, o1);
        b = t2*10 + o2;
      }
      if(b === 0 || b === a) continue;
      return {a, b, answer:a-b};
    }
  }

  // 中等：兩位數 − 兩位數，不借位、不為負
  function makeMid(){
    while(true){
      const t1 = rnd(1,9);
      const o1 = rnd(0,9);
      const t2 = rnd(1, t1);             // 減數十位 >=1 (兩位數)，<=t1 不借位
      const o2 = rnd(0, o1);             // 減數個位 <=o1 不借位
      const a  = t1*10 + o1;
      const b  = t2*10 + o2;
      if(b === a) continue;              // 避免答案 0
      return {a, b, answer:a-b};
    }
  }

  // 進階：兩位數 − 兩位數，有借位、不為負
  function makeHard(){
    while(true){
      const a = rnd(11,99);
      const b = rnd(10, a-1);            // 兩位數且 < a → 結果為正
      if((a % 10) >= (b % 10)) continue; // 個位需借位
      return {a, b, answer:a-b};
    }
  }

  function makeQuestion(){
    if(level === 'mid')  return makeMid();
    if(level === 'hard') return makeHard();
    return makeEasy();
  }

  function buildQuestions(){
    questions = [];
    const seen = new Set();
    let guard = 0;
    while(questions.length < TOTAL && guard < 5000){
      guard++;
      const q = makeQuestion();
      const key = q.a + '-' + q.b;
      if(seen.has(key)) continue;        // 避免重複題
      seen.add(key);
      questions.push(q);
    }
  }

  function renderGrid(){
    gridEl.innerHTML = '';
    questions.forEach((q,i)=>{
      const card = document.createElement('div');
      card.className = 'q';
      card.innerHTML =
        '<span class="no">'+(i+1)+'.</span>'+
        '<span class="eq">'+q.a+' − '+q.b+' =</span>'+
        '<input inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" '+
               'aria-label="第'+(i+1)+'題答案" data-i="'+i+'">'+
        '<span class="mark"></span>';
      gridEl.appendChild(card);
    });
    gridEl.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input',()=>{ inp.value = inp.value.replace(/[^0-9]/g,''); });
    });
  }

  function startTimer(){
    timeLeft = LIMIT;
    updateTimer();
    tick = setInterval(()=>{
      timeLeft--;
      updateTimer();
      if(timeLeft <= 0){ finish(); }
    },1000);
  }
  function updateTimer(){
    timerEl.textContent = timeLeft;
    progEl.style.width = (timeLeft/LIMIT*100) + '%';
    timerEl.classList.toggle('warn', timeLeft <= 10);
  }

  function startGame(lv){
    level = lv;
    finished = false;
    lvTagEl.textContent = LEVEL_NAME[level];
    buildQuestions();
    renderGrid();
    startEl.style.display  = 'none';
    resultEl.style.display = 'none';
    gameEl.style.display   = 'flex';
    window.scrollTo(0,0);
    startTimer();
  }

  function gotoMenu(){
    clearInterval(tick);
    gameEl.style.display   = 'none';
    resultEl.style.display = 'none';
    startEl.style.display  = 'flex';
    window.scrollTo(0,0);
  }

  function finish(){
    if(finished) return;
    finished = true;
    clearInterval(tick);

    let correct = 0;
    gridEl.querySelectorAll('input').forEach(inp=>{
      const i = +inp.dataset.i;
      const q = questions[i];
      const card = inp.closest('.q');
      const mark = card.querySelector('.mark');
      const val = inp.value.trim();
      inp.setAttribute('readonly','');
      card.classList.remove('right','wrong');
      if(val !== '' && +val === q.answer){
        correct++;
        card.classList.add('right');
        mark.textContent = '✅';
      }else{
        card.classList.add('wrong');
        mark.innerHTML = '❌ <span class="correct">'+q.answer+'</span>';
      }
    });

    showResult(correct);
  }

  function showResult(correct){
    const score = correct * 10;   // 每題 10 分，共 100 分
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('reviewText').textContent =
      LEVEL_NAME[level] + '　答對 ' + correct + ' / ' + TOTAL + ' 題';

    let face, msg;
    if(score === 100){ face='🏆'; msg='太厲害了，全對！'; }
    else if(score >= 80){ face='🎉'; msg='很棒喔！'; }
    else if(score >= 60){ face='😀'; msg='不錯，繼續加油！'; }
    else if(score >= 40){ face='💪'; msg='再多練習一下！'; }
    else { face='🌱'; msg='慢慢來，會越來越好！'; }
    document.getElementById('face').textContent = face;
    document.getElementById('msg').textContent  = msg;

    gameEl.style.display   = 'none';
    resultEl.style.display = 'flex';
    window.scrollTo(0,0);
  }

  document.querySelectorAll('.level').forEach(b=>{
    b.addEventListener('click', ()=> startGame(b.dataset.level));
  });
  document.getElementById('againBtn').addEventListener('click', ()=> startGame(level));
  document.getElementById('menuBtn').addEventListener('click', gotoMenu);
  document.getElementById('submitBtn').addEventListener('click', ()=>{
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    finish();
  });
})();
</script>
</body>
</html>
